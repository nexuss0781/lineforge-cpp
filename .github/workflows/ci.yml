name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Ubuntu ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libjpeg-dev libpng-dev fonts-noto-core python3-venv
      - name: Install benchmark dependency
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip Pillow
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$PWD/.venv/bin/python
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
