name: Validate required Actions configuration

on:
  workflow_dispatch:
    inputs:
      check_hf_publish:
        description: Also require the optional Hugging Face publisher configuration
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  validate:
    name: Check required variables and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate selected configuration
        shell: bash
        env:
          LINEFORGE_SOURCE_ROOT: ${{ vars.LINEFORGE_SOURCE_ROOT }}
          LINEFORGE_OUTPUT_ROOT: ${{ vars.LINEFORGE_OUTPUT_ROOT }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_DATASET_LICENSE: ${{ vars.HF_DATASET_LICENSE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHECK_HF_PUBLISH: ${{ inputs.check_hf_publish }}
        run: |
          set -euo pipefail

          required=(LINEFORGE_SOURCE_ROOT LINEFORGE_OUTPUT_ROOT)
          if [[ "$CHECK_HF_PUBLISH" == "true" ]]; then
            required+=(HF_DATASET_REPO HF_DATASET_LICENSE HF_TOKEN)
          fi

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if ((${#missing[@]} > 0)); then
            printf '::error title=Missing Actions configuration::Unset required variables/secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          echo 'All required variables and secrets for the selected workflow path are set.'
