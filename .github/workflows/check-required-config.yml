name: Validate required Actions configuration

on:
  workflow_dispatch:
    inputs:
      check_hf_publish:
        description: Also require the optional Hugging Face publisher configuration
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  validate:
    name: Check required variables and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate selected configuration
        shell: bash
        env:
          LINEFORGE_SOURCE_ROOT: ${{ vars.LINEFORGE_SOURCE_ROOT }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHECK_HF_PUBLISH: ${{ inputs.check_hf_publish }}
        run: |
          set -euo pipefail

          required=(LINEFORGE_SOURCE_ROOT TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION)
          if [[ "$CHECK_HF_PUBLISH" == "true" ]]; then
            required+=(HF_TOKEN)
          fi

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error title=Missing Actions configuration::Unset required variables/secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          echo 'All required variables and secrets for the selected workflow path are set.'
