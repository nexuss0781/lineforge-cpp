name: LineForge dataset dispatch

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: Private deterministic seed from the approved Telegram job plan
        required: true
        type: string
      publish_to_hf:
        description: Publish in-progress checkpoints to public main, then the validated 100,024-image release
        required: false
        default: true
        type: boolean
      checkpoint_images:
        description: Upload a progress checkpoint after this many newly accepted images
        required: false
        default: 5000
        type: number

permissions:
  contents: read

concurrency:
  group: lineforge-dataset-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    name: LineForge dataset dispatch (Telegram fetch + 19 workers + live coordinator)
    runs-on: [self-hosted, linux, x64, lineforge-dataset]
    timeout-minutes: 360
    env:
      LINEFORGE_SOURCE_ROOT: ${{ vars.LINEFORGE_SOURCE_ROOT }}
      LINEFORGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out LineForge
        uses: actions/checkout@v4

      - name: Validate reviewed metadata and create private run paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LINEFORGE_SOURCE_ROOT" ]]; then
            echo "Configure the repository Actions variable LINEFORGE_SOURCE_ROOT to the private directory containing the reviewed metadata manifest.json."
            exit 1
          fi
          if [[ "$LINEFORGE_SOURCE_ROOT" != /* ]]; then
            echo "LINEFORGE_SOURCE_ROOT must be an absolute path on the dedicated runner."
            exit 1
          fi
          [[ -d "$LINEFORGE_SOURCE_ROOT" ]]
          [[ -f "$LINEFORGE_SOURCE_ROOT/manifest.json" ]]
          source_root="$(realpath "$LINEFORGE_SOURCE_ROOT")"
          repo_root="$(realpath "$GITHUB_WORKSPACE")"
          if [[ "$source_root" == / ]]; then
            echo "The filesystem root cannot be used as the reviewed metadata directory."
            exit 1
          fi
          case "$source_root/" in
            "$repo_root/"*) echo "Reviewed source metadata must remain outside the checked-out repository."; exit 1 ;;
          esac
          case "$repo_root/" in
            "$source_root/"*) echo "Reviewed source metadata must not contain the checked-out repository."; exit 1 ;;
          esac

          storage_root="$(dirname "$source_root")"
          runtime_root="$(realpath -m "$storage_root/lineforge-telegram-$LINEFORGE_RUN_ID")"
          output_root="$(realpath -m "$storage_root/lineforge-output")"
          for candidate in "$runtime_root" "$output_root"; do
            case "$candidate/" in
              "$repo_root/"*|"$source_root/"*) echo "Runtime PDFs and dataset outputs must remain outside the checkout and reviewed metadata directory."; exit 1 ;;
            esac
          done
          case "$runtime_root/" in
            "$output_root/"*) echo "Runtime PDF staging must not be inside the persistent dataset output directory."; exit 1 ;;
          esac
          case "$output_root/" in
            "$runtime_root/"*) echo "Persistent dataset outputs must not be inside temporary Telegram staging."; exit 1 ;;
          esac
          [[ ! -e "$runtime_root" ]]
          mkdir -p "$output_root"
          output_root="$(realpath "$output_root")"
          case "$output_root/" in
            "$repo_root/"*|"$source_root/"*) echo "Resolved dataset output path overlaps protected inputs."; exit 1 ;;
          esac
          printf 'LINEFORGE_RUNTIME_SOURCE_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"
          printf 'LINEFORGE_OUTPUT_ROOT=%s\n' "$output_root" >> "$GITHUB_ENV"

          command -v cmake
          command -v c++
          command -v pdfinfo
          command -v pdftoppm
          python3 -c 'import PIL'

      - name: Build and test LineForge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Install Telegram fetch dependencies
        shell: bash
        run: |
          set -euo pipefail
          fetch_venv="$RUNNER_TEMP/lineforge-telegram-fetch"
          python3 -m venv --clear "$fetch_venv"
          "$fetch_venv/bin/python" -m pip install --disable-pip-version-check \
            -r "$GITHUB_WORKSPACE/requirements-telegram-fetch.txt"

      - name: Fetch and verify the approved Telegram PDFs once
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          LINEFORGE_TELEGRAM_CHAT: ${{ vars.LINEFORGE_TELEGRAM_CHAT || '@et_bookstore' }}
          PUBLISH_TO_HF: ${{ inputs.publish_to_hf }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION; do
            if [[ -z "${!name:-}" ]]; then
              echo "The Telegram fetch stage requires the repository Actions secret $name."
              exit 1
            fi
          done
          echo "::add-mask::$TELEGRAM_API_HASH"
          echo "::add-mask::$TELEGRAM_SESSION"
          fetch_args=()
          if [[ "$PUBLISH_TO_HF" == "true" ]]; then
            fetch_args+=(--require-dataset-license)
          fi
          "$RUNNER_TEMP/lineforge-telegram-fetch/bin/python" \
            "$GITHUB_WORKSPACE/scripts/lineforge_telegram_fetch.py" \
            --manifest "$LINEFORGE_SOURCE_ROOT/manifest.json" \
            --output-root "$LINEFORGE_RUNTIME_SOURCE_ROOT" \
            --chat "$LINEFORGE_TELEGRAM_CHAT" \
            --expected-pdf-count 407 \
            "${fetch_args[@]}"

      - name: Install optional Hugging Face publisher dependencies
        if: ${{ inputs.publish_to_hf }}
        shell: bash
        run: |
          set -euo pipefail
          publisher_venv="$RUNNER_TEMP/lineforge-hf-publisher"
          python3 -m venv --clear "$publisher_venv"
          "$publisher_venv/bin/python" -m pip install --disable-pip-version-check \
            -r "$GITHUB_WORKSPACE/requirements-hf-publish.txt"

      - name: Resolve the reviewed dataset license
        if: ${{ inputs.publish_to_hf }}
        shell: bash
        run: |
          set -euo pipefail
          dataset_license="$(python3 - "$LINEFORGE_SOURCE_ROOT/manifest.json" <<'PY'
          import json
          import re
          import sys

          manifest_path = sys.argv[1]
          try:
              with open(manifest_path, encoding="utf-8") as handle:
                  manifest = json.load(handle)
          except (OSError, ValueError) as exc:
              raise SystemExit(f"Cannot read the reviewed source manifest: {exc}")
          files = manifest.get("files") if isinstance(manifest, dict) else None
          if not isinstance(files, list) or len(files) != 407:
              raise SystemExit("The reviewed source manifest must contain exactly 407 eligible sources.")

          licenses = set()
          for index, source in enumerate(files, start=1):
              rights = source.get("redistribution") if isinstance(source, dict) else None
              license_id = rights.get("dataset_license") if isinstance(rights, dict) else None
              if not isinstance(license_id, str) or not license_id.strip():
                  raise SystemExit(f"Eligible source {index} has no reviewed dataset_license clearance.")
              license_id = license_id.strip()
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.+-]{0,63}", license_id):
                  raise SystemExit(f"Eligible source {index} has an invalid dataset_license identifier.")
              licenses.add(license_id)

          if len(licenses) != 1:
              raise SystemExit("All eligible sources must explicitly clear the same dataset license before publication.")
          print(next(iter(licenses)))
          PY
          )"
          printf 'LINEFORGE_DATASET_LICENSE=%s\n' "$dataset_license" >> "$GITHUB_ENV"

      - name: Dispatch 19 workers and one live coordinator
        env:
          LINEFORGE_RUN_SEED: ${{ inputs.run_seed }}
          PUBLISH_TO_HF: ${{ inputs.publish_to_hf }}
          HF_CHECKPOINT_IMAGES: ${{ inputs.checkpoint_images }}
          LINEFORGE_DATASET_LICENSE: ${{ env.LINEFORGE_DATASET_LICENSE }}
          HF_TOKEN: ${{ inputs.publish_to_hf && secrets.HF_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$LINEFORGE_RUN_SEED"
          dispatch_python=python3
          publish_args=()
          if [[ "$PUBLISH_TO_HF" == "true" ]]; then
            if [[ -z "${HF_TOKEN:-}" ]]; then
              echo "Periodic publication requires the repository Actions secret HF_TOKEN."
              exit 1
            fi
            dispatch_python="$RUNNER_TEMP/lineforge-hf-publisher/bin/python"
            publish_args+=(--publish-progress \
              --dataset-license "$LINEFORGE_DATASET_LICENSE" \
              --progress-every-images "$HF_CHECKPOINT_IMAGES" \
              --card-template "$GITHUB_WORKSPACE/docs/huggingface-dataset-card.template.md")
          fi
          "$dispatch_python" scripts/lineforge_dataset.py dispatch \
            --input-manifest "$LINEFORGE_RUNTIME_SOURCE_ROOT/manifest.json" \
            --source-root "$LINEFORGE_RUNTIME_SOURCE_ROOT" \
            --run-dir "$LINEFORGE_OUTPUT_ROOT/$LINEFORGE_RUN_ID" \
            --run-seed "$LINEFORGE_RUN_SEED" \
            --run-id "$LINEFORGE_RUN_ID" \
            --linecrop "$GITHUB_WORKSPACE/build/linecrop" \
            --target 100024 \
            --dpi 300 \
            --timeout-seconds 21600 \
            "${publish_args[@]}"

      - name: Publish final validated dataset to Hugging Face main revision
        if: ${{ inputs.publish_to_hf }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LINEFORGE_DATASET_LICENSE: ${{ env.LINEFORGE_DATASET_LICENSE }}
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "The gated publisher requires the repository Actions secret HF_TOKEN."
            exit 1
          fi
          "$RUNNER_TEMP/lineforge-hf-publisher/bin/python" \
            "$GITHUB_WORKSPACE/scripts/lineforge_hf_publish.py" \
            --run-dir "$LINEFORGE_OUTPUT_ROOT/$LINEFORGE_RUN_ID" \
            --source-manifest "$LINEFORGE_RUNTIME_SOURCE_ROOT/manifest.json" \
            --source-root "$LINEFORGE_RUNTIME_SOURCE_ROOT" \
            --repo-id Nexuss0781/Geez-OCR-Dataset \
            --dataset-license "$LINEFORGE_DATASET_LICENSE" \
            --card-template "$GITHUB_WORKSPACE/docs/huggingface-dataset-card.template.md" \
            --target 100024 \
            --confirm-publish

      - name: Remove temporary Telegram PDF staging
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LINEFORGE_RUNTIME_SOURCE_ROOT:-}" && -d "$LINEFORGE_RUNTIME_SOURCE_ROOT" ]]; then
            case "$(realpath "$LINEFORGE_RUNTIME_SOURCE_ROOT")" in
              "$GITHUB_WORKSPACE"/*) echo "Refusing to clean a Telegram staging path inside the checkout."; exit 1 ;;
            esac
            rm -rf -- "$LINEFORGE_RUNTIME_SOURCE_ROOT"
          fi
